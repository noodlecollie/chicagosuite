[retrotoolchain_dev]
image=docker.io/library/ubuntu:22.04
nvidia=true
home=$HOME/distrobox/retrotoolchain_dev
volume=".:/workspace"
additional_packages=git cmake wget vim genisoimage

# Vista+ cross-compiler
init_hooks=sudo -u ${USER} "/workspace/.distrobox/install-toolchain.sh" "https://github.com/mstorsjo/llvm-mingw/releases/download/20261020/llvm-mingw-20261020-msvcrt-ubuntu-22.04-x86_64.tar.xz"

# XP cross-compiler
init_hooks=sudo -u ${USER} "/workspace/.distrobox/install-toolchain.sh" "https://github.com/mon/llvm-mingw-xp/releases/download/llvm-mingw-xp-22.1.7/llvm-mingw-xp-22.1.7-msvcrt-ubuntu-22.04-x86_64.tar.xz"
