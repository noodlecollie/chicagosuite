[retrotoolchain_dev]
image=docker.io/library/ubuntu:22.04
nvidia=true
home=$HOME/distrobox/retrotoolchain_dev
volume=".:/workspace"
additional_packages=git cmake wget vim genisoimage
init_hooks="sudo -u ${USER} /workspace/.distrobox/user-setup.sh"
init_hooks="sudo -u ${USER} /workspace/.distrobox/install-toolchains.sh"
